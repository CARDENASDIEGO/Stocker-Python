
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .report-card {
            transition: transform 0.2s;
        }
        .report-card:hover {
            transform: translateY(-5px);
        }
        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">Panel de Reportes</h1>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="reportes">
            
<div class="col">
    <div class="card h-100 report-card">
        <div class="card-body text-center">
            <div class="card-icon text-primary">
                <i class="fas fa-building"></i>
            </div>
            <h5 class="card-title">Reporte de Empresas</h5>
            <p class="card-text">
                Última actualización:<br>
                01/11/2025 09:11
            </p>
            <a href="reporte_empresas.html" class="btn btn-primary">Ver Reporte</a>
        </div>
    </div>
</div>


<div class="col">
    <div class="card h-100 report-card">
        <div class="card-body text-center">
            <div class="card-icon text-primary">
                <i class="fas fa-box"></i>
            </div>
            <h5 class="card-title">Reporte de Productos</h5>
            <p class="card-text">
                Última actualización:<br>
                01/11/2025 09:11
            </p>
            <a href="reporte_productos.html" class="btn btn-primary">Ver Reporte</a>
        </div>
    </div>
</div>


<div class="col">
    <div class="card h-100 report-card">
        <div class="card-body text-center">
            <div class="card-icon text-primary">
                <i class="fas fa-users"></i>
            </div>
            <h5 class="card-title">Reporte de Usuarios</h5>
            <p class="card-text">
                Última actualización:<br>
                01/11/2025 09:10
            </p>
            <a href="reporte_usuarios.html" class="btn btn-primary">Ver Reporte</a>
        </div>
    </div>
</div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
